<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Carro de Netbooks - E.E.S.T N°6 "Siderurgia Argentina"</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos de Impresión -->
    <style>
        @media print {
            header, 
            .bg-white.p-5, 
            button,
            .fa-solid,
            input,
            .no-print {
                display: none !important;
            }

            body, main {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                color: black !important;
            }

            .bg-white {
                box-shadow: none !important;
                border: none !important;
            }

            table {
                width: 100% !important;
                font-size: 10px !important;
                border-collapse: collapse !important;
            }

            th, td {
                border: 1px solid #94a3b8 !important;
                padding: 5px !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Institucional -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full overflow-hidden bg-white/10 border border-slate-700 flex items-center justify-center shadow shrink-0">
                    <img src="logo.png" alt="Logo Escuela" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-laptop text-indigo-400\'></i>'">
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">E.E.S.T. N°6 "Siderurgia Argentina"</h1>
                    <p class="text-slate-400 text-xs">Gestión y Rastreo de Carro de 40 Netbooks</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="estadoSincro" class="bg-emerald-900/60 text-emerald-300 border border-emerald-700/50 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Google Sheets Sincronizado
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Panel de Control Superior (Selección de Día) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">SELECCIONAR DÍA DE LA SEMANA</label>
                <select id="selectDia" onchange="renderizarControlNetbooks()" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miércoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                </select>
            </div>
            <div class="md:col-span-2 flex items-center justify-end gap-3">
                <button onclick="abrirModalAsignacionMasiva()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-sm"></i> Registrar Uso de Netbook
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Imprimir Planilla
                </button>
            </div>
        </div>

        <!-- Barra de Búsqueda Global / Rastreo de Netbook -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-2 w-full md:w-[450px]">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="busquedaRastreo" oninput="renderizarControlNetbooks()" placeholder="Buscar por N° de Netbook (ej: 14), alumno, docente o materia..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div class="text-xs text-slate-500 font-medium">
                Mostrando registros para: <span id="labelDiaActual" class="font-bold text-slate-700">Lunes</span>
            </div>
        </div>

        <!-- Tabla / Grilla de Registros -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 text-xs uppercase tracking-wider">
                            <th class="p-3 font-semibold text-center w-24">Netbook</th>
                            <th class="p-3 font-semibold text-center w-36">Módulo / Horario</th>
                            <th class="p-3 font-semibold">Curso / División</th>
                            <th class="p-3 font-semibold">Materia</th>
                            <th class="p-3 font-semibold">Docente a Cargo</th>
                            <th class="p-3 font-semibold">Alumno / Grupo Responsable</th>
                            <th class="p-3 font-semibold text-center w-20 no-print">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaNetbooksBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Generado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para Registrar / Editar Asignación de Netbook -->
    <div id="modalNetbook" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitulo" class="text-base font-bold text-slate-900">Registrar Uso de Netbook</h3>
                <button onclick="cerrarModalNetbook()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="formNetbook" onsubmit="guardarRegistroNetbook(event)" class="space-y-3 text-xs">
                <input type="hidden" id="registroId">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">N° DE NETBOOK (1 al 40)</label>
                        <select id="modalNumNetbook" required class="w-full border border-slate-300 rounded-lg p-2 outline-none font-bold text-indigo-700 bg-slate-50">
                            <!-- Rellenado por JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">DÍA</label>
                        <select id="modalDia" required class="w-full border border-slate-300 rounded-lg p-2 outline-none bg-slate-50">
                            <option value="Lunes">Lunes</option>
                            <option value="Martes">Martes</option>
                            <option value="Miércoles">Miércoles</option>
                            <option value="Jueves">Jueves</option>
                            <option value="Viernes">Viernes</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">MÓDULO HORARIO</label>
                    <select id="modalModulo" required class="w-full border border-slate-300 rounded-lg p-2 outline-none bg-slate-50">
                        <!-- Rellenado por JS -->
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">AÑO Y DIVISIÓN</label>
                        <select id="modalCurso" required class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                            <option value="1° A - Ciclo Básico">1° Año A</option>
                            <option value="1° B - Ciclo Básico">1° Año B</option>
                            <option value="1° C - Ciclo Básico">1° Año C</option>
                            <option value="1° D - Ciclo Básico">1° Año D</option>
                            <option value="1° E - Ciclo Básico">1° Año E</option>
                            <option value="2° A - Ciclo Básico">2° Año A</option>
                            <option value="2° B - Ciclo Básico">2° Año B</option>
                            <option value="2° C - Ciclo Básico">2° Año C</option>
                            <option value="2° D - Ciclo Básico">2° Año D</option>
                            <option value="3° A - Ciclo Básico">3° Año A</option>
                            <option value="3° B - Ciclo Básico">3° Año B</option>
                            <option value="3° C - Ciclo Básico">3° Año C</option>
                            <option value="3° D - Ciclo Básico">3° Año D</option>
                            <option value="4° A - Electrónica">4° Año A (Elec.)</option>
                            <option value="4° B - Electromecánica">4° Año B (Electromec.)</option>
                            <option value="4° C - Electromecánica">4° Año C (Electromec.)</option>
                            <option value="4° D - Electrónica">4° Año D (Elec.)</option>
                            <option value="5° A - Electrónica">5° Año A (Elec.)</option>
                            <option value="5° B - Electromecánica">5° Año B (Electromec.)</option>
                            <option value="6° A - Electrónica">6° Año A (Elec.)</option>
                            <option value="6° B - Electromecánica">6° Año B (Electromec.)</option>
                            <option value="7° A - Electrónica">7° Año A (Elec.)</option>
                            <option value="7° B - Electromecánica">7° Año B (Electromec.)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">MATERIA</label>
                        <input type="text" id="modalMateria" placeholder="Ej: Laboratorio / Programación" required class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">DOCENTE A CARGO</label>
                    <input type="text" id="modalDocente" placeholder="Ej: ARMANI, DAMIAN" required class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">APELLIDO DEL ALUMNO / GRUPO</label>
                    <input type="text" id="modalAlumno" placeholder="Ej: Gómez (o Grupo 1)" required class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="cerrarModalNetbook()" class="px-3 py-2 border border-slate-300 rounded-lg text-slate-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbxZon7ooz2UUYLK8o2XxGTGC4Y7OwzV0A4D6KMFCemJ6ncHlRU2N8BWtbTpVQL3TaA8vw/exec";

        const modulosHorarios = [
            { id: 1, rango: "07:45 - 08:45" },
            { id: 2, rango: "08:55 - 09:55" },
            { id: 3, rango: "10:05 - 11:05" },
            { id: 4, rango: "11:10 - 12:10" },
            { id: 5, rango: "12:25 - 13:25" },
            { id: 6, rango: "13:30 - 14:30" },
            { id: 7, rango: "14:40 - 15:40" },
            { id: 8, rango: "15:50 - 16:50" },
            { id: 9, rango: "16:55 - 17:55" }
        ];

        let registrosNetbooks = [];

        function inicializarSelectsForm() {
            const selectNum = document.getElementById('modalNumNetbook');
            selectNum.innerHTML = '';
            for (let i = 1; i <= 40; i++) {
                selectNum.innerHTML += `<option value="${i}">Netbook N° ${i < 10 ? '0'+i : i}</option>`;
            }

            const selectMod = document.getElementById('modalModulo');
            selectMod.innerHTML = '';
            modulosHorarios.forEach(m => {
                selectMod.innerHTML += `<option value="${m.id}">Módulo ${m.id} (${m.rango})</option>`;
            });
        }

        async function cargarDatosRemotos() {
            try {
                const res = await fetch(scriptURL);
                if (res.ok) {
                    const data = await res.json();
                    registrosNetbooks = data.registros || [];
                } else {
                    console.warn("No se pudo conectar al Google Sheet. Se iniciará vacío.");
                }
            } catch (err) {
                console.error("Error al cargar datos de Google Sheets:", err);
            }
            renderizarControlNetbooks();
        }

        async function guardarDatosRemotos() {
            try {
                const estadoBadge = document.getElementById('estadoSincro');
                estadoBadge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';

                const payload = { registros: registrosNetbooks };
                
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                estadoBadge.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Google Sheets Sincronizado';
            } catch (err) {
                console.error("Excepción al intentar guardar en Google Sheets:", err);
                document.getElementById('estadoSincro').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error al sincronizar';
            }
        }

        function abrirModalAsignacionMasiva() {
            document.getElementById('modalTitulo').innerText = "Registrar Uso de Netbook";
            document.getElementById('formNetbook').reset();
            document.getElementById('registroId').value = '';
            document.getElementById('modalDia').value = document.getElementById('selectDia').value;

            document.getElementById('modalNetbook').classList.remove('hidden');
            document.getElementById('modalNetbook').classList.add('flex');
        }

        function cerrarModalNetbook() {
            document.getElementById('modalNetbook').classList.remove('flex');
            document.getElementById('modalNetbook').classList.add('hidden');
        }

        function guardarRegistroNetbook(e) {
            e.preventDefault();
            const id = document.getElementById('registroId').value;

            const nuevoRegistro = {
                id: id ? parseInt(id) : Date.now(),
                netbookNum: parseInt(document.getElementById('modalNumNetbook').value),
                dia: document.getElementById('modalDia').value,
                moduloId: parseInt(document.getElementById('modalModulo').value),
                curso: document.getElementById('modalCurso').value,
                materia: document.getElementById('modalMateria').value.trim(),
                docente: document.getElementById('modalDocente').value.trim(),
                alumno: document.getElementById('modalAlumno').value.trim()
            };

            if (id) {
                const idx = registrosNetbooks.findIndex(r => r.id === parseInt(id));
                if (idx !== -1) registrosNetbooks[idx] = nuevoRegistro;
            } else {
                registrosNetbooks.push(nuevoRegistro);
            }

            cerrarModalNetbook();
            renderizarControlNetbooks();
            guardarDatosRemotos();
        }

        function editarRegistro(id) {
            const r = registrosNetbooks.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modalTitulo').innerText = "Editar Registro de Netbook";
            document.getElementById('registroId').value = r.id;
            document.getElementById('modalNumNetbook').value = r.netbookNum;
            document.getElementById('modalDia').value = r.dia;
            document.getElementById('modalModulo').value = r.moduloId;
            document.getElementById('modalCurso').value = r.curso;
            document.getElementById('modalMateria').value = r.materia;
            document.getElementById('modalDocente').value = r.docente;
            document.getElementById('modalAlumno').value = r.alumno;

            document.getElementById('modalNetbook').classList.remove('hidden');
            document.getElementById('modalNetbook').classList.add('flex');
        }

        function eliminarRegistro(id) {
            if (confirm("¿Estás seguro de eliminar este registro del historial?")) {
                registrosNetbooks = registrosNetbooks.filter(r => r.id !== id);
                renderizarControlNetbooks();
                guardarDatosRemotos();
            }
        }

        function renderizarControlNetbooks() {
            const diaSeleccionado = document.getElementById('selectDia').value;
            const busqueda = document.getElementById('busquedaRastreo').value.toLowerCase().trim();
            
            document.getElementById('labelDiaActual').innerText = diaSeleccionado;
            const tbody = document.getElementById('tablaNetbooksBody');
            tbody.innerHTML = '';

            let datosFiltrados = [];
            if (busqueda) {
                datosFiltrados = registrosNetbooks.filter(r => 
                    r.netbookNum.toString().includes(busqueda) ||
                    r.alumno.toLowerCase().includes(busqueda) ||
                    r.docente.toLowerCase().includes(busqueda) ||
                    r.materia.toLowerCase().includes(busqueda) ||
                    r.curso.toLowerCase().includes(busqueda) ||
                    r.dia.toLowerCase().includes(busqueda)
                );
            } else {
                datosFiltrados = registrosNetbooks.filter(r => r.dia === diaSeleccionado);
            }

            datosFiltrados.sort((a, b) => a.netbookNum - b.netbookNum || a.moduloId - b.moduloId);

            if (datosFiltrados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-6 text-center text-slate-400 italic">
                            No hay registros de netbooks cargados para este criterio.
                        </td>
                    </tr>
                `;
                return;
            }

            datosFiltrados.forEach(r => {
                const modObj = modulosHorarios.find(m => m.id === r.moduloId);
                const rangoHorario = modObj ? modObj.rango : '';

                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <span class="bg-indigo-50 border border-indigo-200 text-indigo-900 font-bold px-2.5 py-1 rounded-lg text-xs shadow-sm">
                            N° ${r.netbookNum < 10 ? '0'+r.netbookNum : r.netbookNum}
                        </span>
                    </td>
                    <td class="p-3 text-center text-xs">
                        <span class="block font-bold text-slate-700">Módulo ${r.moduloId}</span>
                        <span class="text-slate-500">${r.dia} (${rangoHorario})</span>
                    </td>
                    <td class="p-3 font-semibold text-slate-700 text-xs">${r.curso}</td>
                    <td class="p-3 text-slate-600 font-medium text-xs">${r.materia}</td>
                    <td class="p-3 text-slate-600 text-xs"><i class="fa-solid fa-user-tie text-[10px] mr-1 text-indigo-500"></i>${r.docente}</td>
                    <td class="p-3 font-bold text-slate-900 text-xs"><i class="fa-solid fa-user-graduate text-[10px] mr-1 text-emerald-600"></i>${r.alumno}</td>
                    <td class="p-3 text-center no-print">
                        <div class="flex items-center justify-center gap-1">
                            <button onclick="editarRegistro(${r.id})" title="Editar" class="text-indigo-600 hover:text-indigo-900 p-1.5 hover:bg-indigo-50 rounded-lg"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="eliminarRegistro(${r.id})" title="Eliminar" class="text-rose-600 hover:text-rose-900 p-1.5 hover:bg-rose-50 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = () => {
            inicializarSelectsForm();
            cargarDatosRemotos();
        };
    </script>
</body>
</html>
